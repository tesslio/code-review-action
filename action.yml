name: Tessl Code Review
description: Run Tessl Code Review and publish one native GitHub pull-request review
author: Tessl

branding:
  icon: check-circle
  color: blue

inputs:
  tessl-token:
    description: Tessl API token used by the CLI
    required: true
  profile:
    description: Named Code Review profile or repository YAML profile path
    required: false
    default: standard
  model:
    # Reserved for Tessl's own callers, which pass it on internal runs. Not part
    # of the supported input contract; an unset caller is unaffected. Do not
    # remove it: internal callers set it, and the description stays uninformative
    # on purpose rather than advertising what it does.
    description: Reserved; leave unset
    required: false
    default: ''
  effort:
    description: >-
      Reasoning effort for every review lens: low, medium or high. Overrides any
      effort the profile sets, including a per-lens one. Empty sends none,
      leaving the installed CLI to resolve it from the profile and the model's
      own default.
    required: false
    default: ''
  lenses:
    description: JSON array containing the complete ordered lens selection
    required: false
    default: ''
  mode:
    description: Publication policy, either advisory or gate
    required: false
    default: advisory
  pr-number:
    description: Pull-request number for events without pull-request context
    required: false
    default: ''
  cli-version:
    description: Tessl CLI version to install; "latest" tracks the current release
    required: false
    default: latest
  cli-channel:
    # Internal. Switches the installed CLI to a release channel (head, nightly,
    # beta) after install, replacing the pinned version for that run. Used by
    # Tessl's own callers to exercise unreleased CLI builds; not part of the
    # supported input contract, and unset callers get the pinned version.
    description: Internal Tessl CLI release channel override; empty uses the pinned version
    required: false
    default: ''

outputs:
  status:
    description: Terminal Action status
    value: ${{ steps.finalize.outputs.status }}
  head-sha:
    description: Exact reviewed pull-request head SHA
    value: ${{ steps.pr.outputs['head-sha'] }}
  review-id:
    description: Created or reused GitHub review ID, when available
    value: ${{ steps.review.outputs['review-id'] }}
  result-path:
    description: Absolute path to the structured CLI result
    value: ${{ steps.review.outputs['result-path'] }}
  result-artifact:
    description: Name of the retained public result artifact
    value: ${{ steps.review.outputs['artifact-name'] }}

runs:
  using: composite
  steps:
    - name: Validate Action inputs
      shell: bash
      env:
        TESSL_TOKEN_INPUT: ${{ inputs['tessl-token'] }}
        PROFILE: ${{ inputs.profile }}
        LENSES: ${{ inputs.lenses }}
        MODE: ${{ inputs.mode }}
        EFFORT: ${{ inputs.effort }}
        PR_NUMBER_INPUT: ${{ inputs['pr-number'] }}
      run: |
        set -euo pipefail
        [[ -n "$TESSL_TOKEN_INPUT" ]] || { echo "::error::tessl-token is required."; exit 1; }
        [[ -n "$PROFILE" ]] || { echo "::error::profile must not be empty."; exit 1; }
        [[ "$MODE" == "advisory" || "$MODE" == "gate" ]] || { echo "::error::mode must be advisory or gate."; exit 1; }
        [[ -z "$PR_NUMBER_INPUT" || "$PR_NUMBER_INPUT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr-number must be a positive integer."; exit 1; }
        # Rejected here rather than left to the CLI: an out-of-set value makes the
        # CLI fail before it produces an outcome, and the artifact then falls back
        # to the requested configuration, which would publish the raw value.
        [[ -z "$EFFORT" || "$EFFORT" == "low" || "$EFFORT" == "medium" || "$EFFORT" == "high" ]] || { echo "::error::effort must be low, medium or high."; exit 1; }
        if [[ -n "$LENSES" ]]; then
          jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' <<< "$LENSES" >/dev/null || { echo "::error::lenses must be a JSON array of non-empty strings."; exit 1; }
        fi

    - name: Resolve pull request
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUT_PR_NUMBER: ${{ inputs['pr-number'] }}
      run: node "$GITHUB_ACTION_PATH/src/resolve-pull-request.mjs"

    - name: Start review check run
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        MODE: ${{ inputs.mode }}
        HEAD_SHA: ${{ steps.pr.outputs['head-sha'] }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$GITHUB_ACTION_PATH/src/start-check-run.mjs"

    - name: Check out pull-request head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.pr.outputs['head-repository'] }}
        ref: ${{ steps.pr.outputs['head-sha'] }}
        fetch-depth: 0
        path: .tessl-code-review/workspace
        persist-credentials: false

    - name: Install Tessl CLI
      id: setup
      # Past v2, which sends the version into the download URL unencoded: a
      # release carrying SemVer build metadata (`1.2.3+test.…`) then 403s,
      # which is every prerelease build a caller might pin for validation.
      uses: tesslio/setup-tessl@33e1c9253e3673f28e1b8949475b250dbd57918e # main@33e1c92
      with:
        version: ${{ inputs['cli-version'] }}
        token: ${{ inputs['tessl-token'] }}

    - name: Switch Tessl CLI release channel
      if: inputs['cli-channel'] != ''
      shell: bash
      env:
        TESSL_TOKEN: ${{ inputs['tessl-token'] }}
        CLI_CHANNEL: ${{ inputs['cli-channel'] }}
      run: |
        set -euo pipefail
        tessl cli update --channel "$CLI_CHANNEL"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        {
          echo '### Tessl Code Review CLI channel override'
          echo '```text'
          "$HOME/.local/bin/tessl" --version
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # The CLI is no longer pinned by this Action, so an incompatible pair is
    # possible and has to be legible. Without this, a CLI predating `--publish`
    # fails deep in argument parsing and every review dies with a message that
    # names neither cause nor fix.
    - name: Check the installed CLI can publish
      shell: bash
      run: |
        set -euo pipefail
        if ! tessl code review --help 2>&1 | grep -q -- '--publish'; then
          echo "::error::The installed Tessl CLI ($(tessl --version 2>/dev/null || echo 'unknown version')) cannot publish a review. Set the cli-version input to a release that supports it, or leave it unset to track the latest."
          exit 1
        fi

    - name: Run Tessl Code Review
      id: review
      shell: bash
      working-directory: ${{ github.workspace }}/.tessl-code-review/workspace
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        PROFILE: ${{ inputs.profile }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        LENSES: ${{ inputs.lenses }}
        MODE: ${{ inputs.mode }}
        HEAD_SHA: ${{ steps.pr.outputs['head-sha'] }}
      run: bash "$GITHUB_ACTION_PATH/src/run-review.sh"

    - name: Build public result
      if: always() && steps.review.outputs['artifact-path'] != ''
      shell: bash
      env:
        REVIEW_OUTPUT: ${{ steps.review.outputs['result-path'] }}
        PUBLIC_ARTIFACT_OUTPUT: ${{ steps.review.outputs['artifact-path'] }}
        LENSES: ${{ inputs.lenses }}
        PROFILE: ${{ inputs.profile }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
      run: node "$GITHUB_ACTION_PATH/src/build-public-artifact.mjs"

    - name: Upload public result
      if: always() && steps.review.outputs['artifact-path'] != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.review.outputs['artifact-name'] }}
        path: ${{ steps.review.outputs['artifact-path'] }}
        if-no-files-found: warn

    - name: Publish visible technical failure
      if: always() && steps.review.outputs['exit-code'] != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$GITHUB_ACTION_PATH/src/publish-failure.mjs"

    - name: Apply review conclusion
      id: finalize
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        MODE: ${{ inputs.mode }}
        REVIEW_EXIT_CODE: ${{ steps.review.outputs['exit-code'] }}
        REVIEW_OUTPUT: ${{ steps.review.outputs['result-path'] }}
        CHECK_RUN_ID: ${{ steps.check.outputs['check-run-id'] }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ steps.pr.outputs['head-sha'] }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$GITHUB_ACTION_PATH/src/finalize.mjs"
