name: Tessl Code Review
description: Run Tessl Code Review and publish one native GitHub pull-request review
author: Tessl

branding:
  icon: check-circle
  color: blue

inputs:
  tessl-token:
    description: Tessl API token used by the CLI
    required: true
  profile:
    description: Named Code Review profile
    required: false
    default: standard
  model:
    description: Model override; empty uses the selected profile's default
    required: false
    default: ''
  effort:
    description: Reasoning effort override; empty uses the selected profile's default
    required: false
    default: ''
  lenses:
    description: JSON array containing the complete ordered lens selection
    required: false
    default: ''
  mode:
    description: Publication policy, either advisory or gate
    required: false
    default: advisory
  pr-number:
    description: Pull-request number for events without pull-request context
    required: false
    default: ''

outputs:
  status:
    description: Terminal Action status
    value: ${{ steps.finalize.outputs.status }}
  head-sha:
    description: Exact reviewed pull-request head SHA
    value: ${{ steps.pr.outputs['head-sha'] }}
  review-id:
    description: Created or reused GitHub review ID, when available
    value: ${{ steps.publish.outputs['review-id'] }}
  result-path:
    description: Absolute path to the structured CLI result
    value: ${{ steps.review.outputs['result-path'] }}
  publication-path:
    description: Absolute path to the publication receipt
    value: ${{ steps.review.outputs['publication-path'] }}
  result-artifact:
    description: Name of the retained public result artifact
    value: ${{ steps.review.outputs['artifact-name'] }}

runs:
  using: composite
  steps:
    - name: Validate Action inputs
      shell: bash
      env:
        TESSL_TOKEN_INPUT: ${{ inputs['tessl-token'] }}
        PROFILE: ${{ inputs.profile }}
        LENSES: ${{ inputs.lenses }}
        MODE: ${{ inputs.mode }}
        PR_NUMBER_INPUT: ${{ inputs['pr-number'] }}
      run: |
        set -euo pipefail
        [[ -n "$TESSL_TOKEN_INPUT" ]] || { echo "::error::tessl-token is required."; exit 1; }
        [[ -n "$PROFILE" ]] || { echo "::error::profile must not be empty."; exit 1; }
        [[ "$MODE" == "advisory" || "$MODE" == "gate" ]] || { echo "::error::mode must be advisory or gate."; exit 1; }
        [[ -z "$PR_NUMBER_INPUT" || "$PR_NUMBER_INPUT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr-number must be a positive integer."; exit 1; }
        if [[ -n "$LENSES" ]]; then
          jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' <<< "$LENSES" >/dev/null || { echo "::error::lenses must be a JSON array of non-empty strings."; exit 1; }
        fi

    - name: Resolve pull request
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUT_PR_NUMBER: ${{ inputs['pr-number'] }}
      run: node "$GITHUB_ACTION_PATH/src/resolve-pull-request.mjs"

    - name: Start review check run
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        MODE: ${{ inputs.mode }}
        HEAD_SHA: ${{ steps.pr.outputs['head-sha'] }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$GITHUB_ACTION_PATH/src/start-check-run.mjs"

    - name: Check out pull-request head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.pr.outputs['head-repository'] }}
        ref: ${{ steps.pr.outputs['head-sha'] }}
        fetch-depth: 0
        path: .tessl-code-review/workspace
        persist-credentials: false

    - name: Install Tessl CLI
      id: setup
      uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
      with:
        version: 0.96.0
        token: ${{ inputs['tessl-token'] }}

    - name: Run Tessl Code Review
      id: review
      shell: bash
      working-directory: ${{ github.workspace }}/.tessl-code-review/workspace
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        PROFILE: ${{ inputs.profile }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        LENSES: ${{ inputs.lenses }}
        HEAD_SHA: ${{ steps.pr.outputs['head-sha'] }}
      run: bash "$GITHUB_ACTION_PATH/src/run-review.sh"

    - name: Publish review
      id: publish
      if: steps.review.outputs['exit-code'] == '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ steps.pr.outputs['head-sha'] }}
        REVIEW_OUTPUT: ${{ steps.review.outputs['result-path'] }}
        PUBLISH_OUTPUT: ${{ steps.review.outputs['publication-path'] }}
        MODE: ${{ inputs.mode }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        set +e
        node "$GITHUB_ACTION_PATH/src/publish-review.mjs"
        code="$?"
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Build public result
      if: always() && steps.review.outputs['artifact-path'] != ''
      shell: bash
      env:
        REVIEW_OUTPUT: ${{ steps.review.outputs['result-path'] }}
        PUBLISH_OUTPUT: ${{ steps.review.outputs['publication-path'] }}
        PUBLIC_ARTIFACT_OUTPUT: ${{ steps.review.outputs['artifact-path'] }}
        LENSES: ${{ inputs.lenses }}
      run: node "$GITHUB_ACTION_PATH/src/build-public-artifact.mjs"

    - name: Upload public result
      if: always() && steps.review.outputs['artifact-path'] != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.review.outputs['artifact-name'] }}
        path: ${{ steps.review.outputs['artifact-path'] }}
        if-no-files-found: warn

    - name: Publish visible technical failure
      if: always() && (steps.review.outputs['exit-code'] != '0' || steps.publish.outputs['exit-code'] != '0')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$GITHUB_ACTION_PATH/src/publish-failure.mjs"

    - name: Apply review conclusion
      id: finalize
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        MODE: ${{ inputs.mode }}
        REVIEW_EXIT_CODE: ${{ steps.review.outputs['exit-code'] }}
        PUBLISH_EXIT_CODE: ${{ steps.publish.outputs['exit-code'] }}
        REVIEW_OUTPUT: ${{ steps.review.outputs['result-path'] }}
        PUBLISH_OUTPUT: ${{ steps.review.outputs['publication-path'] }}
        CHECK_RUN_ID: ${{ steps.check.outputs['check-run-id'] }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$GITHUB_ACTION_PATH/src/finalize.mjs"
