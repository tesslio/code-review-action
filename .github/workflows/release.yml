name: Release

# Cuts a release: creates the tagged GitHub release at main's head with the
# commit SHA in the notes. Running this workflow is the human release
# decision; nothing here runs on its own. There is no release branch - the
# released state is the newest release tag.
#
# The Marketplace listing is not updated by this workflow: making the new
# release the Marketplace-listed version is a checkbox on the release page,
# which has no API. The run summary links straight to it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example v2)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A release describes main and nothing else: the dispatch ref must
          # be main, so the tagged SHA and everything read for the notes come
          # from one tree.
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Releases are cut from main; this was dispatched from $GITHUB_REF_NAME."
            exit 1
          fi
          # The tag is dispatch input, and a major ref is derived from it below.
          # Without this, a value like `release.2025` would create that release
          # and then force-move `refs/tags/release`, and a value carrying a slash
          # would address a ref path of its own choosing.
          # A bare major is the moving tag this workflow repoints, so it is never an
          # exact release: naming it would create a release whose own tag a later
          # release moves out from under it.
          if ! printf '%s' "$TAG" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$'; then
            echo "::error::A release tag is v<major>.<minor>[.<patch>] with no leading zeros; got $TAG."
            exit 1
          fi
          # An exact tag is immutable, so a dispatch naming one that exists has to
          # fail here. `gh release create` would otherwise publish a release for
          # the existing tag and ignore --target, describing whatever commit that
          # tag already points at rather than this dispatch's main head.
          #
          # matching-refs answers 200 with an empty array when nothing matches, so
          # absence is a value rather than an error status. Any failure of the call
          # itself therefore stops the release: a transient error must not read as
          # proof that the tag is free.
          existing="$(
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
              --jq "[.[] | select(.ref == \"refs/tags/$TAG\")] | length"
          )" || {
            echo "::error::Could not determine whether $TAG already exists; not releasing."
            exit 1
          }
          if [ "$existing" != "0" ]; then
            echo "::error::$TAG already exists; an exact tag is never moved or reused."
            exit 1
          fi
          SHA=$(git rev-parse origin/main)
          {
            echo "Pin the Action to this release's commit SHA:"
            echo
            echo '```yaml'
            echo "uses: tesslio/code-review-action@${SHA} # ${TAG}"
            echo '```'
            echo
            echo "This revision installs the current Tessl CLI release. Set the"
            echo "\`cli-version\` input to pin an exact one."
            echo
            echo "The major tag now points here, so a caller on that tag is on this"
            echo "revision."
          } > /tmp/notes.md
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file /tmp/notes.md

          # Move the major tag to this release. Without it a caller on `v1` sits
          # on whatever commit the tag was first created at, which looks current
          # and is not: that is worse than a pinned SHA, which at least looks
          # pinned. An exact tag stays immutable; the major tag is the moving one
          # a caller opts into.
          MAJOR="v$(printf '%s' "$TAG" | sed -E 's/^v([0-9]+).*/\1/')"
          if gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" \
               -f sha="$SHA" -F force=true >/dev/null 2>&1 \
             || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f ref="refs/tags/$MAJOR" -f sha="$SHA" >/dev/null 2>&1; then
            echo "::notice::$MAJOR now points at $SHA."
          else
            # The release exists and is correct; only the major tag is behind. Say
            # so and fail, because a caller on $MAJOR is silently on the previous
            # revision until someone finishes this. Re-dispatching cannot fix it:
            # $TAG now exists, and this workflow refuses an existing exact tag.
            echo "::error::Release $TAG was created at $SHA, but $MAJOR was not moved."
            echo "::error::Finish it by hand: gh api -X PATCH repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR -f sha=$SHA -F force=true"
            exit 1
          fi
          {
            echo "### Release ${TAG} cut at ${SHA}"
            echo "Marketplace listing update is manual: open the release, edit, tick the Marketplace checkbox, publish."
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
