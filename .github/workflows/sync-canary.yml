name: Sync canary

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-code-review-canary
  cancel-in-progress: true

jobs:
  validate:
    name: validate prospective merge
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      required: ${{ steps.prepare.outputs.required }}
      main-sha: ${{ steps.prepare.outputs['main-sha'] }}
    steps:
      - name: Check out canary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: canary
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Check out validated main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          path: validated-main
          persist-credentials: false

      - name: Prepare and inspect merge
        id: prepare
        shell: bash
        working-directory: candidate
        env:
          EXPECTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(git -C "$GITHUB_WORKSPACE/validated-main" rev-parse HEAD)"
          git fetch --no-tags "$GITHUB_WORKSPACE/validated-main" 'HEAD:refs/remotes/validated/main'

          if [[ -n "$EXPECTED_MAIN_SHA" && "$main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "A newer main commit is available; its validation run will synchronize canary."
            echo 'required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "$main_sha" HEAD; then
            echo 'Canary already contains the validated main commit.'
            echo 'required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$main_sha"
          echo 'required=true' >> "$GITHUB_OUTPUT"
          echo "main-sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Validate merged canary
        if: steps.prepare.outputs.required == 'true'
        working-directory: candidate
        run: bash scripts/validate-foundation.sh

  sync:
    name: merge validated main into canary
    needs: validate
    if: needs.validate.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create and merge synchronization pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ needs.validate.outputs['main-sha'] }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$REPOSITORY" --base canary --head main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            pull_request="$existing"
          else
            pull_request="$(gh pr create \
              --repo "$REPOSITORY" \
              --base canary \
              --head main \
              --title 'chore(code-review): sync main into canary' \
              --body 'Automated synchronization of the latest validated main revision into canary.')"
          fi
          gh pr merge "$pull_request" \
            --repo "$REPOSITORY" \
            --merge \
            --match-head-commit "$MAIN_SHA"
